<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>English Buddy - 일기로 하는 영어회화</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>English Buddy</h1>
    <p>일기 · 상황 · 주제를 쓰면, 그 내용으로 끝없이 질문하고 대화합니다.</p>
  </header>

  <main>
    <!-- 1단계: 시작 -->
    <section id="setup" class="card">
      <div class="row">
        <label>
          <span>무엇을 쓸까요?</span>
          <select id="mode">
            <option value="diary">오늘의 일기</option>
            <option value="situation">상황 설명</option>
            <option value="topic">주제 하나</option>
          </select>
        </label>
        <label>
          <span>내 레벨</span>
          <select id="level">
            <option value="beginner">초급</option>
            <option value="intermediate" selected>중급</option>
            <option value="advanced">고급</option>
          </select>
        </label>
      </div>
      <textarea id="seed" rows="7" placeholder="한국어로 써도 되고 영어로 써도 됩니다.&#10;예) 오늘 아침에 늦잠을 자서 회사에 지각했다. 팀장님이 아무 말도 안 했는데 그게 더 신경 쓰였다."></textarea>
      <button id="start" class="primary">대화 시작하기</button>
      <p id="setup-error" class="error" hidden></p>
    </section>

    <!-- 2단계: 대화 -->
    <section id="session" hidden>
      <div class="session-grid">
        <div class="chat-col card">
          <div class="summary-bar">
            <span id="summary"></span>
            <button id="review" class="ghost">복습 노트</button>
          </div>
          <div id="chat" class="chat"></div>
          <div class="composer">
            <textarea id="answer" rows="2" placeholder="영어로 답해 보세요. 막히면 한국어로 써도 영어 표현을 알려드립니다."></textarea>
            <button id="send" class="primary">보내기</button>
          </div>
          <p id="chat-error" class="error" hidden></p>
        </div>

        <aside class="side-col card">
          <h2>질문 목록 <small id="qcount"></small></h2>
          <p class="hint">질문을 누르면 답변창에 옮겨집니다.</p>
          <div id="questions"></div>
          <h2>오늘의 표현</h2>
          <div id="vocab"></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-inner card">
      <button id="modal-close" class="ghost close">닫기</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
