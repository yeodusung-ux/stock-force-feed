# english_buddy/web 폴더를 깃허브 Pages(무료 HTTPS)로 배포한다.
# configure-pages 의 enablement 가 Pages 를 대신 켜 주므로 저장소 설정을 손댈 필요가 없다.
name: Deploy English Buddy

on:
  push:
    branches:
      - main
      - claude/english-conversation-app-feasibility-0wyv91
    paths:
      - "english_buddy/web/**"
      - ".github/workflows/english-buddy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: english-buddy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages 가 아직 없으면 여기서 켠다 (Source = GitHub Actions)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: english_buddy/web
      - id: deployment
        uses: actions/deploy-pages@v4
