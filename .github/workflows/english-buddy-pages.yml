# english_buddy/web 폴더를 gh-pages 브랜치로 발행한다. 깃허브가 그 브랜치를 Pages(HTTPS)로 서빙한다.
# gh-pages 는 빌드 결과물 전용 브랜치라서 매번 통째로 덮어쓴다.
name: Deploy English Buddy

on:
  push:
    branches:
      - main
    paths:
      - "english_buddy/web/**"
      - ".github/workflows/english-buddy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-buddy-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish web/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp -r english_buddy/web/. "$site"/
          touch "$site/.nojekyll"          # Jekyll 처리를 건너뛰게 한다
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish English Buddy (${GITHUB_SHA:0:7})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "배포 완료: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
